<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./gamma-mark.svg" />
    <!-- The interface font's regular weight, so text does not first paint in a fallback (src/lib/theme/fonts.css). -->
    <link rel="preload" href="/fonts/instrument-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <title>Gamma Startup</title>
    <script>
      // Apply the stored theme before first paint; mirrors parseThemePreference()
      // and resolveTheme() in src/lib/stores/appearance.ts (default System).
      (function () {
        var preference = "system";
        try {
          var stored = localStorage.getItem("gamma.theme");
          if (stored === "light" || stored === "dark" || stored === "system") preference = stored;
        } catch (error) {}
        var light = preference === "light" ||
          (preference === "system" && !matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", light ? "light" : "dark");
      })();
    </script>
    <!-- Every colour, font and radius below is a token from tokens.css, so the
         splash follows the light and dark themes like the app. -->
    <link rel="stylesheet" href="/src/lib/theme/tokens.css" />
    <style>
      html,
      body {
        background: var(--canvas);
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: var(--text-0);
        font-family: var(--font-ui);
      }

      /* A gateway card (design_principles.md §11): it floats like an overlay. */
      main {
        width: min(28rem, calc(100vw - 2rem));
        padding: var(--space-6);
        border: 1px solid var(--panel-border);
        border-radius: var(--overlay-radius);
        background: var(--panel-bg);
        box-shadow: var(--overlay-shadow);
      }

      .mark-frame {
        width: 4.75rem;
        height: 4.75rem;
        display: grid;
        place-items: center;
        margin-bottom: var(--space-5);
        border-radius: var(--panel-radius);
        background: var(--accent-soft);
      }

      /* The brand mark as the landing card and top bar draw it: the accent
         Γ on the accent tint, readable in both themes. */
      .mark {
        color: var(--accent);
        font-size: 2.6rem;
        font-weight: 600;
        line-height: 1;
      }

      p {
        margin: 0;
      }

      .eyebrow {
        color: var(--text-2);
        font-size: var(--text-xs);
        font-weight: 500;
      }

      h1 {
        margin: var(--space-2) 0 var(--space-3);
        font-size: var(--text-xl);
        font-weight: 600;
      }

      #detail {
        color: var(--text-1);
        font-size: var(--text-base);
        line-height: var(--leading-normal);
      }

      .bar {
        margin-top: var(--space-5);
        height: var(--space-2);
        border-radius: var(--radius-sm);
        background: var(--track);
        overflow: hidden;
      }

      .fill {
        width: 32%;
        height: 100%;
        border-radius: var(--radius-sm);
        background: var(--accent);
        animation: pulse 1.1s infinite ease-in-out;
      }

      @keyframes pulse {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .fill {
          animation: none;
          width: 100%;
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark-frame" aria-hidden="true">
        <span class="mark">Γ</span>
      </div>
      <p class="eyebrow">Gamma desktop</p>
      <h1 id="headline">Starting Python backend</h1>
      <p id="detail">Waiting for the local FastAPI service to become healthy before the main window is created.</p>
      <div class="bar"><div class="fill"></div></div>
    </main>
    <script>
      window.__GAMMA_SET_STATUS__ = (headline, detail) => {
        const headlineNode = document.getElementById("headline");
        const detailNode = document.getElementById("detail");
        if (headlineNode) headlineNode.textContent = headline;
        if (detailNode) detailNode.textContent = detail;
      };
    </script>
  </body>
</html>
