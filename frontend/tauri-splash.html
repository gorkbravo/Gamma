<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./stratalab-mark.svg" />
    <title>StrataLab Startup</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top, rgba(106, 168, 255, 0.16), transparent 48%),
          linear-gradient(180deg, #091018, #05070a 72%);
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: #edf4fb;
      }

      main {
        width: min(28rem, calc(100vw - 2rem));
        border: 1px solid rgba(90, 128, 162, 0.24);
        background: rgba(5, 10, 14, 0.92);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
        padding: 1.5rem;
      }

      .mark-frame {
        width: 4.75rem;
        height: 4.75rem;
        display: grid;
        place-items: center;
        margin-bottom: 1rem;
        border: 1px solid rgba(90, 128, 162, 0.24);
        background:
          radial-gradient(circle at 50% 24%, rgba(106, 168, 255, 0.16), transparent 58%),
          linear-gradient(180deg, rgba(10, 16, 23, 0.96), rgba(6, 9, 13, 0.96));
      }

      .mark {
        width: 3.1rem;
        height: auto;
        display: block;
      }

      p {
        margin: 0;
      }

      .eyebrow {
        color: #87b7ff;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        font-size: 0.72rem;
      }

      h1 {
        margin: 0.5rem 0 0.6rem;
        font-size: 1.6rem;
      }

      #detail {
        color: #b8c6d4;
        line-height: 1.5;
      }

      .bar {
        margin-top: 1rem;
        height: 0.4rem;
        background: rgba(18, 33, 45, 0.9);
        overflow: hidden;
      }

      .fill {
        width: 32%;
        height: 100%;
        background: linear-gradient(90deg, rgba(106, 168, 255, 0.3), rgba(106, 168, 255, 1));
        animation: pulse 1.1s infinite ease-in-out;
      }

      @keyframes pulse {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark-frame" aria-hidden="true">
        <img class="mark" src="./stratalab-mark.svg" alt="" />
      </div>
      <p class="eyebrow">StrataLab Desktop Shell</p>
      <h1 id="headline">Starting Python backend</h1>
      <p id="detail">Waiting for the local FastAPI service to become healthy before the main window is created.</p>
      <div class="bar"><div class="fill"></div></div>
    </main>
    <script>
      window.__STRATALAB_SET_STATUS__ = (headline, detail) => {
        const headlineNode = document.getElementById("headline");
        const detailNode = document.getElementById("detail");
        if (headlineNode) headlineNode.textContent = headline;
        if (detailNode) detailNode.textContent = detail;
      };
    </script>
  </body>
  </html>
