[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gamma-research"
version = "0.1.0"
description = "Gamma: read-only market research workspace (FastAPI backend for the Svelte/Tauri desktop app)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.38,<3",
    "ib_insync>=0.9.86",
    "pandas>=2.1",
    "numpy>=1.26",
    "python-dotenv>=1.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "edgartools>=5.28.4,<6",
    "openai-agents>=0.17.4,<0.18",
    "websockets>=12",
    "yfinance>=0.2.54",
]

[project.optional-dependencies]
# dev incluye el cliente antiguo para que la suite completa (también sus tests) siga ejecutándose.
dev = ["pytest>=7.4", "httpx>=0.27", "pyinstaller>=6.13", "gamma-research[legacy-desktop]"]
# Cliente de escritorio PySide antiguo (src/ui, `gamma-pyside`). El backend y la app Tauri no lo necesitan.
legacy-desktop = ["PySide6>=6.6", "matplotlib>=3.8", "plotly>=5.18", "kaleido>=0.2.1"]

[project.scripts]
gamma-desktop = "src.desktop_launcher:main"
gamma-pyside = "src.main:main"

[tool.setuptools]
packages = ["src", "src.api", "src.api.routes", "src.api.schemas", "src.application", "src.ui", "src.ui.tabs", "src.ui.widgets", "src.services", "src.analytics", "src.models", "src.utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Importa `src` del checkout o worktree que se prueba, no del paquete editable del venv.
pythonpath = ["."]
