[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myquantwork"
version = "0.1.0"
description = "Desktop portfolio risk app for IBKR"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "ib_insync>=0.9.86",
    "pandas>=2.1",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "plotly>=5.18",
    "kaleido>=0.2.1",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "edgartools>=5.28.4,<6",
    "openai-agents>=0.17.4,<0.18",
    "websockets>=12",
    "yfinance>=0.2.54",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.27", "pyinstaller>=6.13"]

[project.scripts]
gamma-desktop = "src.desktop_launcher:main"
gamma-pyside = "src.main:main"

[tool.setuptools]
packages = ["src", "src.api", "src.api.routes", "src.api.schemas", "src.application", "src.ui", "src.ui.tabs", "src.ui.widgets", "src.services", "src.analytics", "src.models", "src.utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
