[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myquantwork"
version = "0.1.0"
description = "Desktop portfolio risk app for IBKR"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "ib_insync>=0.9.86",
    "pandas>=2.1",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "plotly>=5.18",
    "kaleido>=0.2.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools]
packages = ["src", "src.application", "src.ui", "src.ui.tabs", "src.ui.widgets", "src.services", "src.analytics", "src.models", "src.utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
